<mat-toolbar> <mat-icon>coffee</mat-icon><span>Coffee Craft</span> </mat-toolbar>
<main class="main">
  <mat-tab-group #homeTabs>
    <mat-tab label="Base">
      <app-drink-builder 
      (next)="handleNext(homeTabs)"
      [(selectedBase)]="selectedBase"
      [(selectedCupSize)]="selectedCupSize"
      [(selectedMilk)]="selectedMilk" 
      /> 
    </mat-tab>
    <mat-tab label="Customize"
      ><app-customize
        (back)="handleBack(homeTabs)"
        (review)="handleNext(homeTabs)"
        [(temperature)]="temperature"
        [(foamDensity)]="foamDensity"
    /></mat-tab>
    <mat-tab label="Confirm"> <app-confirm [coffeeDetails]="coffeeDetails()" /> </mat-tab>
  </mat-tab-group>
</main>
